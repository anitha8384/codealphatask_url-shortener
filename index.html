<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shortly — URL Shortener</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <p class="eyebrow">URL SHORTENER</p>
    <h1>Make a long link short.</h1>
    <p class="intro">Paste an HTTP or HTTPS link and get a shareable short URL.</p>
    <form id="shorten-form">
      <label for="url">Long URL</label>
      <div class="form-row">
        <input id="url" name="url" type="url" placeholder="https://example.com/a/very/long/link" required>
        <button type="submit">Shorten</button>
      </div>
    </form>
    <p id="message" class="message" role="status" aria-live="polite"></p>
  </main>
  <script>
    const form = document.querySelector('#shorten-form');
    const message = document.querySelector('#message');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = 'Creating short URL…';
      const response = await fetch('/api/shorten', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({url: document.querySelector('#url').value})
      });
      const data = await response.json();
      if (!response.ok) { message.textContent = data.error; return; }
      message.innerHTML = `Your short URL: <a href="${data.short_url}" target="_blank" rel="noopener">${data.short_url}</a>`;
    });
  </script>
</body>
</html>
